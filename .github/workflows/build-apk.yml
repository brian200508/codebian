name: Build APK

# Manually triggered only ("user toggled") -- never runs on push/PR, so it
# can't accidentally build/publish anything from an in-progress commit.
# Trigger it from the Actions tab -> "Build APK" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repo debug - list files and check for gradlew
        shell: bash
        run: |
          set -euo pipefail
          echo "PWD: $(pwd)"
          echo "Top-level files:"
          ls -la
          echo "Git-tracked gradlew files (if any):"
          git ls-files | grep -E '(^|/)gradlew$' || true

      - name: Grant execute permission for gradlew if present
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            echo "Found root ./gradlew - making executable"
            chmod +x ./gradlew
          else
            echo "./gradlew not found at repo root"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and install components
        uses: android-actions/setup-android@v3
        with:
          components: |
            platforms;android-35
            build-tools;35.0.0
            cmdline-tools;latest

      - name: Debug Android SDK location
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "Listing SDK root (first 200 lines):"
            ls -R "${ANDROID_SDK_ROOT}" | sed -n '1,200p' || true
          fi

      - name: Ensure cmdline-tools path + accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          sdkRoot="${ANDROID_SDK_ROOT:?}"
          echo "ANDROID_SDK_ROOT=$sdkRoot"
          # find sdkmanager (search recursively)
          sdk="$(find "$sdkRoot" -type f -name sdkmanager -print -quit || true)"
          if [ -z "$sdk" ]; then
            echo "sdkmanager not found under ANDROID_SDK_ROOT ($sdkRoot)" >&2
            ls -R "$sdkRoot" | sed -n '1,200p'
            exit 1
          fi
          echo "Found sdkmanager at: $sdk"
          chmod +x "$sdk"
          installArgs=( "platforms;android-35" "build-tools;35.0.0" )
          maxRetries=3
          # Clear problematic Java options and use a clean environment for sdkmanager
          unset _JAVA_OPTIONS
          unset JAVA_TOOL_OPTIONS
          export _JAVA_OPTIONS="-XX:+IgnoreUnrecognizedVMOptions"
          # export _JAVA_OPTIONS="-XX:+IgnoreUnrecognizedVMOptions --add-modules java.base"
          # export _JAVA_OPTIONS="-XX:+IgnoreUnrecognizedVMOptions --add-modules java.base,java.xml.bind,java.base --add-exports java.base/sun.nio.ch=ALL-UNNAMED"
          for i in $(seq 1 $maxRetries); do
            if "$sdk" --install "${installArgs[@]}" --sdk_root="$sdkRoot"; then
              break
            fi
            echo "sdkmanager install failed (attempt $i of $maxRetries)"
            if [ "$i" -eq "$maxRetries" ]; then
              exit 1
            fi
            sleep $((5 * i))
          done
          # accept licenses (avoid failing on yes SIGPIPE) -- write one "y" then stop
          printf "y\n" | "$sdk" --licenses --sdk_root="$sdkRoot" || true

      - name: Write local.properties (points at the CI-provisioned SDK)
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Fetch proot binaries (jniLibs)
        shell: bash
        run: |
          chmod +x ./scripts/fetch-assets.sh
          ./scripts/fetch-assets.sh

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build APK
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE}" = "release" ]; then
            task="assembleRelease"
          else
            task="assembleDebug"
          fi

          # Determine which Gradle command to run:
          # 1) prefer ./gradlew at repo root (and ensure executable)
          # 2) search repo for a gradlew file (subdirectory) and run that
          # 3) fall back to 'gradle' (provided by gradle/actions/setup-gradle)
          if [ -x ./gradlew ]; then
            echo "Using root ./gradlew"
            GRADLE_CMD="./gradlew"
          else
            echo "Root ./gradlew not executable or missing, searching repository..."
            gpath="$(git ls-files | grep -E '(^|/)gradlew$' | head -n1 || true)"
            if [ -n "$gpath" ]; then
              echo "Found gradlew at: $gpath"
              chmod +x "$gpath"
              # ensure we run from repository root even if wrapper is in subdir
              GRADLE_CMD="./$gpath"
            else
              echo "No gradlew found in repo; falling back to 'gradle' from setup-gradle"
              GRADLE_CMD="gradle"
            fi
          fi

          echo "Running: $GRADLE_CMD $task"
          $GRADLE_CMD "$task" --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codebian-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
